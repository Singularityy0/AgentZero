<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic IDE</title>
  </head>
  <body>
    <div class="ide-container">
      <!-- Activity Bar (Leftmost icons) -->
      <nav class="activity-bar">
        <div class="activity-bar-actions">
          <button
            class="activity-action active"
            data-target="explorer"
            title="Explorer"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"
              ></path>
              <polyline points="13 2 13 9 20 9"></polyline>
            </svg>
          </button>
          <button class="activity-action" data-target="chat" title="AI Chat">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
              ></path>
            </svg>
          </button>
          <button
            class="activity-action"
            data-target="settings"
            title="Settings"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              ></path>
            </svg>
          </button>
        </div>
      </nav>

      <!-- Sidebar (Collapsible content) -->
      <aside class="sidebar">
        <!-- Explorer View -->
        <div id="view-explorer" class="sidebar-view active">
          <div class="sidebar-header">EXPLORER</div>
          <div id="file-tree" class="file-tree-container">
            <!-- Populated by explorer.ts -->
          </div>
        </div>

        <!-- Chat View -->
        <div id="view-chat" class="sidebar-view">
          <div class="sidebar-header">AI CHAT</div>
          <div class="chat-container">
            <div id="chat-history" class="chat-history"></div>
            <div class="chat-input-wrapper">
              <input type="text" id="chat-input" placeholder="Ask Agent..." />
            </div>
          </div>
        </div>

        <!-- Settings View -->
        <div id="view-settings" class="sidebar-view">
          <div class="sidebar-header">PROVIDER SETTINGS</div>
          <div class="settings-container">
            <div id="providers-list"></div>
            <p id="vault-status" class="vault-status"></p>
          </div>
        </div>
      </aside>

      <!-- Main Editor Area -->
      <main class="editor-area">
        <div class="editor-tabs">
          <div class="editor-tab active" id="active-file-tab">Welcome</div>
        </div>
        <div id="monaco-container" class="monaco-container">
          <div class="welcome-screen">
            <h2>Agentic IDE</h2>
            <p>Select a file from the Explorer to start editing.</p>
          </div>
        </div>
      </main>
    </div>

    <!-- Status Bar (Bottom) -->
    <footer class="status-bar">
      <div class="status-left">
        <span class="status-item"
          ><svg
            viewBox="0 0 24 24"
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span id="status-workspace-name">Loading workspace...</span></span
        >
        <span class="status-item hoverable" id="status-connection"
          >Connected</span
        >
      </div>
      <div class="status-right">
        <span
          class="status-item"
          id="status-readonly"
          title="Editing and saving from the GUI is not wired up yet"
          >Read-only</span
        >
        <span class="status-item" id="status-line-col">Ln -, Col -</span>
        <span class="status-item">UTF-8</span>
        <span class="status-item" id="status-language">plaintext</span>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
