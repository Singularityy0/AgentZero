name: Release

# Two ways to get installers, and they mean different things.
#
# A push to `main` refreshes the `latest` prerelease, so there is always one URL
# holding a build of current main - which is what a reviewer or teammate needs
# between versions. A `v*` tag publishes a permanent, versioned release.
#
# Both build each platform on its own native runner. Cross-building is refused
# on purpose: the bundled ripgrep binary and the Rust sidecar are both
# platform-specific, so a package built for another OS would ship executables
# that cannot run.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

# No `paths-ignore`. It would skip documentation-only pushes, which is tempting,
# but GitHub applies path filters to tag pushes as well - so tagging a commit
# that happened to touch only documentation would silently publish nothing. A
# release that quietly does not happen is worse than a few wasted CI minutes.
# Concurrency cancellation below keeps a burst of pushes to one build.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others work.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux (AppImage + deb)
            artifact: linux
          - os: macos-14
            label: macOS (dmg)
            artifact: macos
          - os: windows-2022
            label: Windows (nsis + portable)
            artifact: windows

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A release must not ship code the suite rejects, and running it on each
      # platform is also the only cross-platform check the project has.
      - name: Test
        run: pnpm test

      - name: Build GUI bundle
        run: pnpm --filter @agentic-runtime/gui build

      # Release mode for the shipped sidecar: 13.5 MB against 39.5 MB debug, and
      # faster at parsing and graph ranking.
      - name: Build release sidecar
        run: pnpm build:rust:release

      # Unsigned builds are intentional: signing needs paid Apple and Windows
      # certificates. Reviewers on macOS must right-click → Open on first launch.
      - name: Package installers
        run: pnpm --filter @agentic-runtime/desktop dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-zero-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.dmg
            packages/desktop/release/*.exe

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    # Publish whatever built. A platform failing should not withhold the ones
    # that succeeded - but a partial release must say so, so the notes below
    # list the platforms actually present rather than leaving a reader to
    # notice the gap from the file list.
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4

      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Nothing to publish is the one case where a release should not be cut:
      # replacing `latest` with an empty release would remove a working
      # download and put nothing in its place.
      - name: Check what built
        id: built
        run: |
          shopt -s nullglob
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers were produced; nothing to publish."
            echo "any=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "any=true" >> "$GITHUB_OUTPUT"
          ls -lh artifacts

          # Record which platforms made it, for the release notes.
          {
            echo "| Platform | Status |"
            echo "| -------- | ------ |"
            for p in "Windows:*.exe" "macOS:*.dmg" "Linux:*.AppImage"; do
              label="${p%%:*}"; glob="${p#*:}"
              matches=(artifacts/$glob)
              if [ ${#matches[@]} -gt 0 ]; then
                echo "| $label | Included |"
              else
                echo "| $label | **Not built in this run** |"
              fi
            done
          } > platforms.md
          cat platforms.md

      # `gh` is preinstalled on the runner, so this needs no third-party action
      # with write access to the repository.
      - name: Publish tagged release
        if: steps.built.outputs.any == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --title "Agent Zero ${{ github.ref_name }}" \
            --notes-file platforms.md \
            --generate-notes

      # Written to a file rather than passed inline: a multi-line string inside
      # a YAML block would carry the block's indentation into the notes, and ten
      # leading spaces turn a Markdown table into a code block.
      - name: Compose rolling release notes
        if: steps.built.outputs.any == 'true' && github.ref == 'refs/heads/main'
        run: |
          cat > notes.md <<'NOTES'
          Automatic build of `main`.

          Unsigned: on macOS, right-click the app and choose Open on first
          launch; on Windows, SmartScreen warns on an unsigned installer.


          NOTES
          # The platform table is generated, not written by hand, so a release
          # cut while one runner is broken says which OS is missing instead of
          # looking complete.
          cat platforms.md >> notes.md
          {
            echo ""
            echo "Windows ships an installer and a portable build."
            echo ""
            echo "Built from ${{ github.sha }}."
          } >> notes.md

      # Deleted and recreated rather than edited, so the `latest` tag always
      # points at the commit these binaries were actually built from.
      - name: Refresh the rolling build from main
        if: steps.built.outputs.any == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest artifacts/* \
            --title "Agent Zero - latest from main" \
            --target "${{ github.sha }}" \
            --prerelease \
            --notes-file notes.md
