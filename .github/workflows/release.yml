name: Build desktop installers

# The bundled ripgrep binary is platform-specific and electron-builder cannot
# produce a macOS image off macOS, so each installer is built on its own native
# runner rather than cross-compiled from one machine.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux (AppImage + deb)
            artifact: linux
          - os: macos-14
            label: macOS (dmg)
            artifact: macos
          - os: windows-2022
            label: Windows (nsis + portable)
            artifact: windows

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Build GUI bundle
        run: pnpm --filter @agentic-runtime/gui build

      # Release mode for the shipped sidecar: 13.5 MB against 39.5 MB debug,
      # and faster at parsing and graph ranking.
      - name: Build release sidecar
        run: pnpm build:rust:release

      # Unsigned builds are intentional: signing needs paid Apple and Windows
      # certificates. Reviewers on macOS must right-click → Open on first launch.
      - name: Package installers
        run: pnpm --filter @agentic-runtime/desktop dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-zero-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.dmg
            packages/desktop/release/*.exe
